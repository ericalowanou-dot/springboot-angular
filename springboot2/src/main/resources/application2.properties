# Nom de l'application
spring.application.name=com.ucao.dgi.l3
server.port=8081

# Configuration de la base de donn�es PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5432/rad_db
spring.datasource.url=
spring.datasource.username=postgres
spring.datasource.password=1106
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGeneration123456789012345678901234567890
jwt.expiration=86400000

# Upload Configuration
app.upload.dir=uploads
app.base.url=http://localhost:8081

# Multipart File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
