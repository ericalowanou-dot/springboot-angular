<div class="login-container">
  <h2>Connexion</h2>

  <form (ngSubmit)="login()">
    <label>Identifiant :</label>
    <input type="text" [(ngModel)]="identifiant" name="identifiant">

    <label>Mot de passe :</label>
    <input type="password" [(ngModel)]="motDePasse" name="motDePasse">

    <button type="submit">Se connecter</button>
  </form>
</div>
