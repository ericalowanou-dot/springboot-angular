<h2>Liste des clients</h2>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Nom</th>
    <th>Prénom</th>
    <th>Email</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let c of clients">
    <td>{{ c.id }}</td>
    <td>{{ c.nom }}</td>
    <td>{{ c.prenom }}</td>
    <td>{{ c.email }}</td>
    <td>
      <button (click)="edit(c.id)">Modifier</button>
    </td>
  </tr>
</table>
