<h2>Liste des plats</h2>

<button routerLink="/plats/create">Créer un plat</button>

<table border="1" width="100%">
  <thead>
  <tr>
    <th>ID</th>
    <th>Nom</th>
    <th>Prix</th>
    <th>Actions</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let plat of plats">
    <td>{{ plat.idPlat }}</td>
    <td>{{ plat.nom }}</td>
    <td>{{ plat.prix }}</td>

    <td>
      <button [routerLink]="['/plats/update', plat.idPlat]">Modifier</button>
      <button (click)="delete(plat.idPlat)">Supprimer</button>
    </td>
  </tr>
  </tbody>
</table>
