<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Le Gourmet · Gestion de restaurant</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gestion de restaurant : commandes, carte, livraisons, stocks et personnel." />
    <meta name="theme-color" content="#ea580c" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // applique le thème avant le premier rendu pour éviter un flash clair
      try {
        var t = localStorage.getItem('rad.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
