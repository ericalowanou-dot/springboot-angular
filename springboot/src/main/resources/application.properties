# ============================================================
#  Configuration principale.
#  Aucune valeur sensible ici : tout passe par des variables
#  d'environnement (les valeurs par défaut ne servent qu'en local).
# ============================================================
spring.application.name=rad-restaurant
server.port=${PORT:8081}

# --- Base de données PostgreSQL ---
# Soit DATABASE_URL (URL complète fournie par Render), soit les variables DB_* ci-dessous.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rad_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
# Dialecte explicite : en cas d'échec de connexion, l'erreur affichée est la vraie cause
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# --- Sécurité / JWT ---
# En production, définir JWT_SECRET (>= 32 caractères aléatoires).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Origines autorisées à appeler l'API (séparées par des virgules, jokers acceptés)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://*.onrender.com}

# Compte administrateur créé au premier démarrage si aucun utilisateur n'existe
app.admin.email=${ADMIN_EMAIL:admin@restaurant.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Jeu de données de démonstration (inséré seulement si la base est vide)
app.demo-data=${DEMO_DATA:true}

# --- Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
