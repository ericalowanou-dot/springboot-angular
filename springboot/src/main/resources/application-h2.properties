# Profil de développement sans PostgreSQL : base H2 enregistrée dans ./data
# Lancement : ./gradlew bootRun --args='--spring.profiles.active=h2'
spring.datasource.url=jdbc:h2:file:./data/rad_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
