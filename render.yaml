# Blueprint Render : base PostgreSQL + API Spring Boot (Docker) + frontend Angular (site statique).
# Render > New > Blueprint > sélectionner ce dépôt.
databases:
  - name: rad-db
    plan: free
    databaseName: rad_db
    user: rad_user

services:
  - type: web
    name: rad-api
    runtime: docker
    rootDir: springboot
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: rad-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: rad-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: rad-db, property: database }
      - key: DB_USER
        fromDatabase: { name: rad-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: rad-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@restaurant.com
      - key: ADMIN_PASSWORD
        sync: false # à saisir dans le tableau de bord Render
      - key: CORS_ORIGINS
        value: https://*.onrender.com
      - key: DEMO_DATA
        value: "true"

  - type: web
    name: rad-front
    runtime: static
    rootDir: rad_angular
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/rad_angular/browser
    routes:
      # application monopage : toutes les routes servent index.html
      - type: rewrite
        source: /*
        destination: /index.html
